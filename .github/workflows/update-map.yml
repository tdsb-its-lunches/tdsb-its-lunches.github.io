name: Update My Maps JSON

on:
    schedule:
        # Runs at 04:17 UTC (~12:17 AM EDT / 11:17 PM EST)
        # Using minute 17 bypasses top-of-the-hour congestion delays
        # - cron: "17 4 * * *"
        - cron: "5 17 * * *"    
    workflow_dispatch:

permissions:
    contents: write

jobs:
    update-data:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Run Python conversion script
              run: python3 scripts/update-places.py

            - name: Commit and push changes
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add .
                  git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update map places [skip ci]" && git push)
